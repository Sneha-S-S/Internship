<!DOCTYPE html>
<html>
<head>
    <title>Bank Account Application</title>

    <style>
        body {
            font-family: Cambria;
            background-color: #f0cccc;
            margin: 30px;
            padding: 30px;
        }

        form {
            background-color: white;
            width: 500px;
            margin: auto;
            padding: 30px;
            border: 5px solid #333;
            border-radius: 10px;
        }
    

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: rgb(106, 82, 243)
        }

        label {
            display:inline-block;
            width: 150px;
            margin-bottom: 10px;
        }

        textarea {
            vertical-align: top;
        }

        input[type="submit"] {
            background-color: green;
            color: white;
        }

        input[type="reset"] {
            background-color: red;
            color: white;
        }
    </style>
</head>

<body>

<form>

    <h2>Bank Account Opening Form</h2>

    <label>Full Name:</label>
    <input type="text" name="name" placeholder="Enter your name" required>
    <br><br>

    <label>Date of Birth:</label>
    <input type="date" name="dob" placeholder="Enter your date of birth" required>
    <br><br>

    <label>Gender:</label>
    <input type="radio" name="gender" value="male" required> Male
    <input type="radio" name="gender" value="female" required> Female
    <input type="radio" name="gender" value="other" required> Other
    <br><br>

    <label>Email:</label>
    <input type="email" name="email" placeholder="Enter your email" required>
    <br><br>

    <label>Phone Number:</label>
    <input type="number" name="phone" placeholder="Enter your phone number" required>
    <br><br>

    <label>Account Type:</label>
    <select name="account">
        <option>Savings Account</option>
        <option>Current Account</option>
        <option>Salary Account</option>
    </select>
    <br><br>

    <label>Occupation:</label>
    <input type="text" name="occupation" placeholder="Enter your occupation">
    <br><br>

    <label>Address:</label>
    <textarea rows="4" cols="25" placeholder="Enter your address"></textarea>
    <br><br>

    <label>ID Proof:</label>
    <select name="id_proof" required>
        <option>Aadhaar Card</option>
        <option>PAN Card</option>
        <option>Driving Licence</option>
        <option>Passport</option>
    </select>
    <br><br>

    <label>ID Proof Number:</label>
    <input type="number" name="id" placeholder="Enter your ID proof number" required>
    <br><br>

    <label>Upload ID Proof:</label>
    <input type="file">
    <br><br>

    <input type="checkbox" required>
    I agree to the terms and conditions.
    <br><br>

    <center>
        <input type="submit" value="Submit">
        <input type="reset" value="Cancel">
    </center>

</form>

</body>
</html>
