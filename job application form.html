<<!DOCTYPE html>
<html>
<head>
    <title>Job Application Form</title>
</head>

<body>

<h2>Job Application Form</h2>

<form>

    <label>Full Name:</label>
    <input type="text" name="name" required>
    <br><br>

    <label>Email:</label>
    <input type="email" name="email" required>
    <br><br>

    <label>Phone Number:</label>
    <input type="tel" name="phone" required>
    <br><br>

    <label>Date of Birth:</label>
    <input type="date" name="dob">
    <br><br>

    <label>Gender:</label>
    <input type="radio" name="gender" value="male"> Male
    <input type="radio" name="gender" value="female"> Female
    <input type="radio" name="gender" value="other"> Other
    <br><br>

    <label>Qualification:</label>
    <select name="qualification">
        <option>BCA</option>
        <option>BBA</option>
        <option>BE</option>
        <option>B.Com</option>
        <option>MCA</option>
        <option>Other</option>
    </select>
    <br><br>

    <label>Skills:</label><br>
    <input type="checkbox" name="skill"> HTML
    <input type="checkbox" name="skill"> CSS
    <input type="checkbox" name="skill"> JavaScript
    <input type="checkbox" name="skill"> Python
    <br><br>

    <label>Experience:</label>
    <input type="text" name="experience" placeholder="Fresher / Experienced">
    <br><br>

    <label>Upload Resume:</label>
    <input type="file" name="resume">
    <br><br>

    <label>Address:</label><br>
    <textarea name="address" rows="4" cols="40"></textarea>
    <br><br>

    <input type="submit" value="Apply">
    <input type="reset" value="Cancel">

</form>

</body>
</html>
